name: Release

on:
  push:
    tags: ['v*']
  # Manual run: builds the jobs and keeps their artifacts, but publishes nothing,
  # so the Android job can be proven without creating a release.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    # Releases are only built from tags; a dispatch is a dry run.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck:electron
      # Sync is build-time configuration, exactly as in pages.yml: without these
      # variables the desktop build is local-only rather than broken.
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
      - run: npx electron-builder --win nsis --publish never

      # The hash a winget manifest needs, printed where it is easy to copy.
      - name: Checksums
        shell: pwsh
        run: |
          $lines = Get-ChildItem release/*.exe | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)"
          }
          $lines | Set-Content release/SHA256SUMS.txt -Encoding ascii
          "### Windows installer SHA-256" | Add-Content $env:GITHUB_STEP_SUMMARY
          '```' | Add-Content $env:GITHUB_STEP_SUMMARY
          $lines | Add-Content $env:GITHUB_STEP_SUMMARY
          '```' | Add-Content $env:GITHUB_STEP_SUMMARY

      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            release/*.exe
            release/SHA256SUMS.txt
          if-no-files-found: error

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.exe
            release/SHA256SUMS.txt
          generate_release_notes: true

  # A sideloadable debug APK, so nobody has to install the Android SDK to try the
  # app on a phone. It waits on `windows` on purpose: that job creates the GitHub
  # release, and this one appends to it. Running both at once makes them race to
  # create the same tag, which fails with "already_exists".
  android:
    needs: windows
    # On a tag, wait for `windows` to create the release. On a dispatch that job
    # is skipped, and `always()` is what lets this one run anyway.
    if: always() && (needs.windows.result == 'success' || needs.windows.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # AGP 8.13 needs a modern JDK; Capacitor 8 targets 21.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      # No android-actions/setup-android here: it always runs `sdkmanager tools`
      # first, and that package no longer exists in the SDK repo, so the step dies
      # with "Failed to find package 'tools'" before anything else runs. The
      # ubuntu-latest image already ships the SDK; it only needs these packages.
      - name: Install the SDK platform the project compiles against
        run: |
          SDKMANAGER=$(command -v sdkmanager || ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | tail -1)
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0"
          echo "sdk.dir=$ANDROID_HOME" >> android/local.properties
          "$SDKMANAGER" --list_installed | grep -E 'platforms;android-36|build-tools;36.0.0'

      - run: npm ci
      # Sync is build-time configuration, exactly as in the desktop and web builds.
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
      - run: npx cap sync android
      # Android only accepts an upgrade over a higher-versionCode APK, so the tag's
      # version is stamped in from package.json rather than left at build.gradle's
      # scaffold value. semver folded into an integer: major*10000+minor*100+patch.
      - name: Build the debug APK
        run: |
          version=$(node -p "require('./package.json').version")
          code=$(node -e "
            const [major, minor, patch] = require('./package.json').version.split('.').map(Number);
            if (![major, minor, patch].every(Number.isInteger)) {
              throw new Error('package.json version is not semver: ' + require('./package.json').version);
            }
            console.log(major * 10000 + minor * 100 + patch);
          ")
          echo "Building versionName=$version versionCode=$code"
          cd android && chmod +x gradlew && ./gradlew assembleDebug "-PversionName=$version" "-PversionCode=$code" --no-daemon

      # A wrong versionCode only shows up as "app not installed" on a phone, so
      # fail here instead of shipping it.
      - name: Check the APK carries that version
        run: |
          version=$(node -p "require('./package.json').version")
          apk=android/app/build/outputs/apk/debug/app-debug.apk
          aapt2=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          code=$(node -p "const v=require('./package.json').version.split('.').map(Number); v[0]*10000+v[1]*100+v[2]")
          "$aapt2" dump badging "$apk" | grep '^package:'
          "$aapt2" dump badging "$apk" | grep -q "versionName='$version'" || {
            echo "::error::APK versionName does not match package.json ($version)"; exit 1; }
          "$aapt2" dump badging "$apk" | grep -q "versionCode='$code'" || {
            echo "::error::APK versionCode was not stamped from package.json ($code)"; exit 1; }

      - name: Name the APK after the version
        run: |
          version=$(node -p "require('./package.json').version")
          cp android/app/build/outputs/apk/debug/app-debug.apk "Flowstate-$version-debug.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: Flowstate-*-debug.apk
          if-no-files-found: error

      # The release already exists (the windows job made it), so no
      # generate_release_notes here: that would rewrite its body. A dispatch run
      # stops above this line with the APK in the run's artifacts.
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: Flowstate-*-debug.apk

  # Opens the microsoft/winget-pkgs update PR for the release that the windows
  # job just published. wingetcreate update can only bump a package that already
  # exists, so this stays off until the hand-submitted 1.0.0 manifest is merged
  # and the WINGET_SUBMIT repository variable is set to true.
  winget:
    needs: windows
    if: vars.WINGET_SUBMIT == 'true' && startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version and installer URL
        id: target
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $url = "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/Flowstate-Setup-$version.exe"
          "version=$version" >> $env:GITHUB_OUTPUT
          "url=$url" >> $env:GITHUB_OUTPUT

      # wingetcreate has no --sha256 flag, so the printed hash is used to prove
      # the asset the manifest will point at is the one this release built.
      - name: Check the published installer against the release SHA-256
        shell: pwsh
        run: |
          $base = "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}"
          $expected = ((Invoke-WebRequest "$base/SHA256SUMS.txt").Content.Trim() -split '\s+')[0].ToLower()
          Invoke-WebRequest "${{ steps.target.outputs.url }}" -OutFile Flowstate-Setup.exe
          $actual = (Get-FileHash Flowstate-Setup.exe -Algorithm SHA256).Hash.ToLower()
          if ($actual -ne $expected) { throw "Release asset is $actual, SHA256SUMS.txt says $expected" }
          Write-Host "verified $actual"

      - name: Open the winget update PR
        shell: pwsh
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          Invoke-WebRequest https://aka.ms/wingetcreate/latest -OutFile wingetcreate.exe
          .\wingetcreate.exe update Shido275.Flowstate `
            --version "${{ steps.target.outputs.version }}" `
            --urls "${{ steps.target.outputs.url }}" `
            --submit `
            --token "$env:WINGET_TOKEN"
