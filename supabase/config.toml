# Local Supabase CLI settings for Flowstate.
#
# `supabase start` brings up this stack, `supabase db push` applies
# supabase/migrations/*.sql in order, and `supabase link --project-ref <ref>`
# connects it to the hosted project. Nothing here holds a secret: the anon key
# the CLI prints for local development is public by design.
project_id = "flowstate"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true

[realtime]
enabled = true

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
