appId: com.flowstate.app
productName: Flowstate
copyright: © 2026 Flowstate contributors

directories:
  output: release
  buildResources: build

# The renderer is a self-contained vite build and the main process only uses
# electron and node built-ins, so no node_modules need to ship.
files:
  - dist/**/*
  - electron/main.js
  - electron/preload.cjs
  - package.json
  - '!node_modules/**/*'

asar: true

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.ico
  artifactName: Flowstate-Setup-${version}.${ext}
  # No certificate is configured, so the installer is unsigned and Windows will
  # show "Unknown publisher" until win.sign (or Azure Trusted Signing) is set.

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Flowstate
  uninstallDisplayName: Flowstate
  deleteAppDataOnUninstall: false
