ShortDescription: A free, open-source, local-first songwriting studio.
Description: |-
  Flowstate is a calm place to write lyrics: live rhyme colouring, syllable
  counts, scansion, a beat grid, section structure, voice takes, an offline beat
  machine and a booth teleprompter. Everything is stored on the device, so the
  app works with no account and no network; cloud sync is optional and stays off
  until you sign in.
